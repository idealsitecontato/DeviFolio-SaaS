<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gerencie seus projetos, portfólio e resultados no Devifolio.">
  <meta name="theme-color" content="#121619">
  <title>Início — Devifolio</title>
  <link rel="icon" type="image/png" href="assets/devifolio-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard-reference.css">
  <link rel="stylesheet" href="dashboard-light.css">
  <link rel="stylesheet" href="dashboard-rounded.css">
  <link rel="stylesheet" href="brand-logo.css">
  <link rel="stylesheet" href="dashboard-v3.css">
  <link rel="stylesheet" href="visual-adjustments.css">
  <link rel="stylesheet" href="screen-loading.css">
  <link rel="stylesheet" href="interaction-refinements.css">
  <link rel="stylesheet" href="reference-fidelity.css">
  <link rel="stylesheet" href="ui-polish.css">
  <link rel="stylesheet" href="internal-layout.css">
  <link rel="stylesheet" href="models.css">
  <link rel="stylesheet" href="dashboard-scale.css">
</head>
<body class="dashboard-app">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Menu principal">
      <div class="sidebar-resize-handle" id="sidebar-resize-handle" role="separator" aria-label="Redimensionar menu lateral" aria-orientation="vertical" aria-valuemin="180" aria-valuemax="320" aria-valuenow="190" tabindex="0"></div>
      <div class="brand-crop" aria-label="Devifolio"><span class="brand-mark devifolio-mark"><img src="assets/devifolio-brand-original.png" alt=""></span><span class="brand-name">Devifolio</span></div>
      <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Recolher menu" aria-expanded="true" data-tooltip="Recolher menu"><span data-icon="menu"></span></button>
      <nav class="side-nav side-nav-primary" id="side-nav">
        <a class="nav-item active" href="#inicio" data-route="inicio" data-tooltip="Início"><span data-icon="home"></span><span>Início</span></a>
        <a class="nav-item" href="#projetos" data-route="projetos" data-tooltip="Projetos"><span data-icon="folder"></span><span>Projetos</span></a>
        <a class="nav-item" href="#portfolio" data-route="portfolio" data-tooltip="Meus Portfólios"><span data-icon="layout"></span><span>Meus Portfólios</span></a>
        <a class="nav-item" href="#modelos" data-route="modelos" data-tooltip="Modelos"><span data-icon="palette"></span><span>Modelos</span></a>
        <a class="nav-item" href="#github" data-route="github" data-tooltip="GitHub"><span data-icon="github"></span><span>GitHub</span></a>
        <a class="nav-item" href="#analise" data-route="analise" data-tooltip="Análise"><span data-icon="chart"></span><span>Análise</span></a>
        <a class="nav-item" href="#perfil" data-route="perfil" data-tooltip="Perfil"><span data-icon="profile"></span><span>Perfil</span></a>
      </nav>
      <div class="sidebar-spacer"></div>
      <a class="sidebar-referral" href="#indicacao" aria-label="Indique a DeviFolio e receba 1 mês de Devi Plus">
        <span class="sidebar-referral-icon" aria-hidden="true">✦</span>
        <strong>Receba 1 mês de<br>Devi Plus</strong>
        <span class="sidebar-referral-cta">Indicar <span aria-hidden="true">→</span></span>
      </a>
      <button class="user-mini" id="user-menu-toggle" type="button" aria-expanded="false" aria-controls="user-menu" data-tooltip="Conta">
        <span class="avatar"></span><span><b>Sua conta</b><small></small></span><span data-icon="chevron"></span>
      </button>
      <div class="user-menu" id="user-menu" hidden>
        <button type="button" data-route-button="perfil"><span data-icon="profile"></span>Perfil</button>
        <button type="button" data-route-button="configuracoes"><span data-icon="settings"></span>Configurações</button>
        <a href="cadastro.html#login" data-logout><span data-icon="logout"></span>Sair</a>
      </div>
      <nav class="side-nav side-nav-utility" aria-label="Conta">
        <a class="nav-item" href="#configuracoes" data-route="configuracoes" data-tooltip="Configurações"><span data-icon="settings"></span><span>Configurações</span></a>
        <a class="nav-item" href="cadastro.html#login" data-logout data-tooltip="Sair"><span data-icon="logout"></span><span>Sair</span></a>
      </nav>
    </aside>

    <div class="mobile-topbar">
      <button class="icon-button" id="menu-toggle" aria-label="Abrir menu" aria-expanded="false"><span data-icon="menu"></span></button>
      <div class="brand-crop brand-mobile" aria-label="Devifolio"><span class="brand-mark devifolio-mark"><img src="assets/devifolio-brand-original.png" alt=""></span><span class="brand-name">Devifolio</span></div>
      <button class="avatar avatar-small" type="button" data-route-button="perfil" aria-label="Abrir perfil"></button>
    </div>

    <main class="main-content">
      <header class="desktop-topbar" aria-label="Localização atual">
        <span id="breadcrumb-section">Início</span><i aria-hidden="true">/</i><strong id="breadcrumb-page">Dashboard</strong>
      </header>
      <div id="page-content" class="page-content" aria-live="polite"></div>
    </main>
  </div>
  <div class="screen-loading" id="app-loading" role="status" aria-live="polite" aria-hidden="false"><span class="spinner" aria-hidden="true"></span><p>Carregando...</p></div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div id="modal-root"></div>
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
